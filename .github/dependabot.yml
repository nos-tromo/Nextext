version: 2
# Every update waits 7 days after its upstream release before Dependabot
# proposes it, so a compromised or broken release is usually caught upstream
# first. Security updates are exempt and still open immediately. Our own
# nos-tromo/* workflows skip the wait, so a hub release is not held back. The
# base images skip it too; the docker entry says why.
# Dependabot can only date Docker Hub images: refreshes of images from other
# registries (ghcr.io, ...) are proposed without the wait, which is where the
# shared CI's signed-provenance check carries the weight.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pyrefly and ruff are centrally pinned in nos-tromo/.github/configs/
    # python-strict/ and mirrored into pyproject.toml; the strict-config CI
    # check fails on any local drift. They move only when the canonical
    # config moves (manual re-mirror), never via an automated bump here.
    ignore:
      - dependency-name: "pyrefly"
      - dependency-name: "ruff"
      # setuptools is a [build-system] requirement only, so Dependabot can
      # raise that floor but never refreshes the runtime copy in uv.lock
      # (pulled in by torch, spacy and thinc). Once the floor allows the
      # newest release, every run fails with "No files have changed!".
      # Refresh the lockfile copy by hand with
      # `uv lock --upgrade-package setuptools`.
      - dependency-name: "setuptools"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # react and react-dom are separate npm packages that React 19 requires
      # to be at the *exact* same version — react-dom throws "Incompatible
      # React versions" from its client entrypoint otherwise, which fails
      # every test file that renders. Ungrouped, Dependabot proposes them as
      # independent bumps, so whichever lands first is red by construction.
      # @types/* are listed so the type surface moves with the runtime it
      # describes; the patterns are exact names, so react-router-dom,
      # react-markdown and friends keep their own individual PRs.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      # The base images skip the wait. A fix for their OS packages arrives
      # only as a digest refresh, and CI's image scan fails on a fixable
      # critical until it lands. Dependabot holds such a refresh until the
      # tag has gone 7 days without a push, which can take weeks for a tag
      # rebuilt every few days.
      exclude:
        - "library/*"
        - "nginxinc/nginx-unprivileged"
    # The backend base image's interpreter line is fixed by requires-python
    # (">=3.12,<3.13"), uv.lock and the CI matrix, and the builder runs uv with
    # UV_PYTHON_DOWNLOADS=0, so any other python:* tag fails `uv sync` by
    # construction. Moving it is a deliberate migration (lockfile, wheels, CI
    # matrix, Dockerfile, docs), never an automated bump. Digest refreshes
    # within the 3.12 tag still flow — those are not version updates.
    ignore:
      - dependency-name: "library/python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "nos-tromo/*"
