name: nextext

x-no-proxy-env: &no-proxy-env
  NO_PROXY: "backend,frontend,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"
  no_proxy: "backend,frontend,localhost,127.0.0.1,172.16.0.0/12,10.0.0.0/8${EXTRA_NO_PROXY:-}"

x-env-file: &env-file
  - ../.env

##########################################################
# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
##########################################################
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, no capabilities; both images run non-root
# with read-only root filesystems.
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  ##########################################################
  # Nextext backend — FastAPI + pipeline + CLI. CPU-only:
  # all model inference runs on external endpoints.
  ##########################################################
  backend:
    <<: *hardened
    image: nextext-backend:${NEXTEXT_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    # /tmp holds per-job media workspaces (multi-GB uploads get normalized
    # there), so it is a disk-backed scratch volume rather than a RAM tmpfs;
    # `down -v` may delete it — it never holds durable state.
    read_only: true
    environment:
      <<: *no-proxy-env
      DIARIZE_API_BASE: ${DIARIZE_API_BASE:-}
      DIARIZE_TIMEOUT: ${DIARIZE_TIMEOUT:-}
      INFERENCE_PROVIDER: ${INFERENCE_PROVIDER:-ollama}
      NER_API_BASE: ${NER_API_BASE:-}
      NER_TIMEOUT: ${NER_TIMEOUT:-}
      NEXTEXT_API_HOST: ${NEXTEXT_API_HOST:-0.0.0.0}
      NEXTEXT_API_PORT: ${NEXTEXT_API_PORT:-8000}
      NEXTEXT_AUTH_HEADER: ${NEXTEXT_AUTH_HEADER:-X-Auth-User}
      NEXTEXT_DEFAULT_IDENTITY: ${NEXTEXT_DEFAULT_IDENTITY:-}
      NEXTEXT_MAX_UPLOAD_MB: ${NEXTEXT_MAX_UPLOAD_MB:-8192}
      NEXTEXT_OFFLINE: ${NEXTEXT_OFFLINE:-1}
      OPENAI_API_BASE: ${OPENAI_API_BASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
      RESPONSE_LANGUAGE: ${RESPONSE_LANGUAGE:-}
      TEXT_MODEL: ${TEXT_MODEL:-}
      VAD_API_BASE: ${VAD_API_BASE:-}
      VAD_TIMEOUT: ${VAD_TIMEOUT:-}
      WHISPER_API_BASE: ${WHISPER_API_BASE:-}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-}
      # Explicit (match the volume mounts) rather than derived from $HOME
      # (deploy ADR 0001 — the non-root user's rootfs is read-only).
      NLTK_DATA: /home/app/nltk_data
      SPACY_MODEL_DIR: /home/app/.cache/spacy
    env_file: *env-file
    volumes:
      - nltk-cache:/home/app/nltk_data
      - spacy-cache:/home/app/.cache/spacy
      - tmp-jobs:/tmp
    networks:
      nextext-net:
        aliases:
          - backend
      inference-net:
        aliases:
          - nextext-backend

  ##########################################################
  # Nextext frontend — React SPA (nginx). Same-origin proxy
  # to the backend; browser uploads stream through nginx
  # without buffering whole files in any Python process.
  ##########################################################
  frontend:
    <<: *hardened
    image: nextext-frontend:${NEXTEXT_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    logging: *default-logging
    # nginx (unprivileged image) writes pid/temp under /tmp; the envsubst
    # entrypoint renders the template into /etc/nginx/conf.d at startup
    # (mode=1777: the tmpfs shadows the image dir root-owned). Uploads
    # stream through unbuffered (proxy_request_buffering off), so no
    # large temp space is needed here.
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,mode=1777
    environment:
      <<: *no-proxy-env
      NEXTEXT_CLIENT_MAX_BODY_SIZE: ${NEXTEXT_CLIENT_MAX_BODY_SIZE:-8192m}
    env_file: *env-file
    networks:
      nextext-net:
      edge-net:
        aliases:
          - nextext-frontend
    depends_on:
      backend:
        condition: service_healthy

##########################################################
# Volumes — spaCy/NLTK language-resource caches only;
# model inference happens on external endpoints.
##########################################################
volumes:
  nltk-cache:
    external: true
  spacy-cache:
    external: true
  # Disk-backed /tmp job workspace (scratch by nature, not external).
  tmp-jobs:

##########################################################
# Networks
##########################################################
networks:
  nextext-net:
  inference-net:
    external: true
    name: ${INFERENCE_NETWORK:-inference-net}
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}
